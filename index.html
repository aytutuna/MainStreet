<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3a3a50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Main Street</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="top">
    <button type="button" id="swap" class="pill" hidden>Town</button>
    <div id="cash" class="pill"><img class="ico" src="assets/coin.png" alt=""><b id="cash-n"></b><span id="rate"></span></div>
    <button type="button" id="gear" class="pill" aria-label="Menu"><i></i><i></i><i></i></button>
  </div>
  <div id="bottom">
    <div id="card" hidden>
      <button type="button" id="card-x" aria-label="Close">x</button>
      <h2 id="card-name"></h2>
      <div class="bar"><i id="card-bar"></i></div>
      <p id="card-info"></p>
      <button type="button" id="card-go" class="btn"></button>
    </div>
    <button type="button" id="next" class="btn">
      <i id="next-fill"></i>
      <span id="next-txt"></span>
      <span id="next-cost"></span>
    </button>
  </div>
  <div id="banner" hidden></div>
  <div id="away" class="veil" hidden>
    <div class="box">
      <h2>While you were away</h2>
      <p id="away-txt"></p>
      <button type="button" id="away-ok" class="btn">OK</button>
    </div>
  </div>
  <div id="end" class="veil" hidden>
    <div class="box">
      <h2>The town is done for now</h2>
      <p>More places are coming.</p>
      <button type="button" id="end-ok" class="btn">Keep looking around</button>
    </div>
  </div>
  <div id="menu" class="veil" hidden>
    <div class="box">
      <h2>Menu</h2>
      <button type="button" id="m-snd" class="btn alt"></button>
      <button type="button" id="m-copy" class="btn alt">Copy code</button>
      <div class="row"><input id="m-code" type="text" placeholder="Paste a code" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="m-load" class="btn alt">Load code</button></div>
      <button type="button" id="m-reset" class="btn alt">Reset town</button>
      <p class="credit">Art: LimeZu (https://limezu.itch.io/)</p>
      <button type="button" id="m-ok" class="btn">Close</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
</body>
</html>
