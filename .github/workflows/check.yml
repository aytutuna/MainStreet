name: Check

# Fast checks on Linux, with no Xcode or Android SDK. TestFlight runs it first.
on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Syntax of the game scripts
        run: |
          for f in *.js lang/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: Bundle lists
        run: node scripts/check_bundle.mjs
      - name: Language files
        run: node scripts/check_lang.mjs --all
      - name: Simulation and saves
        run: node scripts/check_sim.mjs
      - name: Chain of stores
        run: node scripts/check_chain.mjs
      - name: Cloud save rules
        run: node scripts/check_cloud.mjs
      - name: Back under the net and find cards
        run: node scripts/check_back.mjs
      - name: Deal kept while another pack is tapped
        run: node scripts/check_deal.mjs
      - name: Audio context held while asking
        run: node scripts/check_audio.mjs
      - name: Language pick dropped when its panel closes
        run: node scripts/check_lang_wait.mjs
      - name: No interstitials
        run: |
          if git grep -n -i -E 'interstitial|5084191623|6205701600' -- . ':!.github/workflows/check.yml' ':!vendor'; then
            exit 1
          fi
      - name: Ads capped at G, no child tag
        run: |
          grep -q 'maxAdContentRating = .general' ios/MainStreet/AdsBridge.swift
          grep -q 'MAX_AD_CONTENT_RATING_G' android/app/src/main/java/com/aytutuna/mainstreet/AdsBridge.kt
          if git grep -n -i -E 'tagForChildDirected|tagForUnderAgeOfConsent|TagForChildDirectedTreatment' -- ios android; then
            exit 1
          fi
      - name: Licence files
        run: |
          for d in assets/ assets/*/ assets/models/*/; do
            [ "$d" = assets/models/ ] && continue
            test -f "${d}License.txt" || { echo "no License.txt in $d"; exit 1; }
          done
      - name: Privacy manifest
        run: |
          python3 - <<'PY'
          import plistlib, sys
          m = plistlib.load(open('ios/MainStreet/PrivacyInfo.xcprivacy', 'rb'))
          import subprocess
          uses_att = subprocess.run(['git', 'grep', '-q', 'requestTrackingAuthorization', '--', 'ios/*.swift']).returncode == 0
          if uses_att:
              if not m.get('NSPrivacyTracking'):
                  sys.exit('ATT is requested in ios code but NSPrivacyTracking is not true')
              for t in ('DeviceID', 'AdvertisingData'):
                  e = [d for d in m.get('NSPrivacyCollectedDataTypes', []) if d['NSPrivacyCollectedDataType'].endswith(t)]
                  if not e or not e[0].get('NSPrivacyCollectedDataTypeTracking'):
                      sys.exit(t + ' must be declared as used for tracking')
          if m.get('NSPrivacyTrackingDomains'):
              sys.exit('tracking domains listed: ad hosts in the list would be blocked without ATT')
          cats = [t.get('NSPrivacyAccessedAPIType') for t in m.get('NSPrivacyAccessedAPITypes', [])]
          if not cats:
              sys.exit('NSPrivacyAccessedAPITypes is missing or empty')
          if 'NSPrivacyAccessedAPICategoryUserDefaults' not in cats:
              import subprocess
              if subprocess.run(['git', 'grep', '-q', 'UserDefaults', '--', 'ios/*.swift']).returncode == 0:
                  sys.exit('UserDefaults used in ios code but not declared in the manifest')
          PY
