# XcodeGen spec for the iPhone app (the workflows pin its release and SHA-256).
# `xcodegen generate --spec ios/project.yml` writes ios/MainStreet.xcodeproj, which is not checked in.
# The game files stay at the repository root and are copied into the bundle root as they are.
name: MainStreet

options:
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"

# Pinned releases of the two SDKs and Google's consent SDK, which the ads package depends on anyway.
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.103.2
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.13.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0

targets:
  MainStreet:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: MainStreet
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - MainStreet.entitlements
      - path: MainStreet/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../index.html
        buildPhase: resources
      - path: ../style.css
        buildPhase: resources
      - path: ../i18n.js
        buildPhase: resources
      - path: ../data.js
        buildPhase: resources
      - path: ../sim.js
        buildPhase: resources
      - path: ../store.js
        buildPhase: resources
      - path: ../plan.js
        buildPhase: resources
      - path: ../land.js
        buildPhase: resources
      - path: ../walls.js
        buildPhase: resources
      - path: ../shop.js
        buildPhase: resources
      - path: ../ui.js
        buildPhase: resources
      - path: ../vendor
        type: folder
      - path: ../assets
        type: folder
      - path: ../lang
        type: folder
    entitlements:
      path: MainStreet/MainStreet.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_NAME: MainStreet
        MS_TESTER: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.aytutuna.mainstreet
        INFOPLIST_FILE: MainStreet/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
