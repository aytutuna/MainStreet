# XcodeGen spec for the iPhone app (the workflows pin its release and SHA-256).
# `xcodegen generate --spec ios/project.yml` writes ios/MainStreet.xcodeproj, which is not checked in.
# The game files stay at the repository root and are copied into the bundle root as they are.
name: MainStreet

options:
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"

targets:
  MainStreet:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: MainStreet
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: MainStreet/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../index.html
        buildPhase: resources
      - path: ../style.css
        buildPhase: resources
      - path: ../data.js
        buildPhase: resources
      - path: ../sim.js
        buildPhase: resources
      - path: ../mall.js
        buildPhase: resources
      - path: ../ui.js
        buildPhase: resources
      - path: ../vendor
        type: folder
      - path: ../assets
        type: folder
    settings:
      base:
        PRODUCT_NAME: MainStreet
        PRODUCT_BUNDLE_IDENTIFIER: com.aytutuna.mainstreet
        INFOPLIST_FILE: MainStreet/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
