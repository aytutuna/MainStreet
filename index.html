<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3a3a50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Main Street</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="tags"></div>
  <div id="top">
    <div id="bar">
      <div id="cash" class="pill"><img class="ico" src="assets/coin.png" alt=""><div><b id="cash-n"></b><span id="rate"></span></div></div>
      <div id="gems" class="pill sm"><img class="ico" src="assets/ui_gem.png" alt=""><b id="gem-n"></b></div>
      <div id="stars" class="pill sm"><img class="ico" src="assets/ui_star.png" alt=""><b id="star-n"></b></div>
      <button type="button" id="gear" class="pill" aria-label="Menu"><i></i><i></i><i></i></button>
    </div>
    <div id="goals"></div>
    <div id="turn"><button type="button" id="turn-l" aria-label="Rotate left">&#8634;</button><button type="button" id="turn-r" aria-label="Rotate right">&#8635;</button></div>
    <div id="side">
      <span id="x2" class="pill sm" hidden></span>
    </div>
  </div>
  <div id="fly"></div>
  <div id="bottom">
    <div id="card" hidden>
      <button type="button" id="card-x" aria-label="Close">x</button>
      <div id="card-row"></div>
    </div>
    <button type="button" id="best" class="btn">
      <i id="best-fill"></i>
      <span id="best-txt"></span>
      <span id="best-cost"></span>
    </button>
    <div id="tabs">
      <button type="button" id="t-biz"><img src="assets/ui_goal.png" alt="">Departments</button>
      <button type="button" id="t-boost"><img src="assets/ui_bolt.png" alt="">Boosts</button>
      <button type="button" id="t-daily"><img src="assets/ui_gift.png" alt=""><u id="daily-dot" hidden></u>Daily</button>
      <button type="button" id="t-sell"><img src="assets/ui_star.png" alt=""><u id="sell-dot" hidden></u>Stars</button>
    </div>
  </div>
  <div id="sheet" hidden>
    <div id="sheet-head">
      <b>Departments</b>
      <div id="modes"><button type="button" data-m="1">x1</button><button type="button" data-m="10">x10</button><button type="button" data-m="100">x100</button><button type="button" data-m="0">Max</button></div>
      <button type="button" id="sheet-x" aria-label="Close">x</button>
    </div>
    <div id="list"></div>
  </div>
  <div id="banner" hidden></div>
  <div id="away" class="veil" hidden>
    <div class="box">
      <h2>While you were away</h2>
      <p id="away-txt"></p>
      <button type="button" id="away-ok" class="btn">Collect</button>
    </div>
  </div>
  <div id="daily" class="veil" hidden>
    <div class="box wide">
      <h2>Daily reward</h2>
      <p id="daily-txt"></p>
      <div id="days"></div>
      <button type="button" id="daily-ok" class="btn">Claim</button>
      <button type="button" id="daily-x" class="btn alt">Close</button>
    </div>
  </div>
  <div id="boost" class="veil" hidden>
    <div class="box">
      <h2>Boosts</h2>
      <p id="boost-gems"></p>
      <div class="offer"><img src="assets/ui_bolt.png" alt=""><div><b>Double income</b><span id="x2-txt"></span></div><button type="button" id="b-x2" class="btn"></button></div>
      <div class="offer"><img src="assets/ui_warp.png" alt=""><div><b>Time warp</b><span id="warp-txt"></span></div><button type="button" id="b-warp" class="btn"></button></div>
      <p class="small">Gems come from goals, milestones and the daily reward.</p>
      <button type="button" id="boost-x" class="btn alt">Close</button>
    </div>
  </div>
  <div id="sell" class="veil" hidden>
    <div class="box">
      <h2>Sell the store</h2>
      <p id="sell-txt"></p>
      <p class="small" id="sell-keep"></p>
      <button type="button" id="sell-ok" class="btn"></button>
      <button type="button" id="sell-x" class="btn alt">Not now</button>
    </div>
  </div>
  <div id="loading"><div class="box"><b>Main Street</b><i><u id="load-bar"></u></i></div></div>
  <div id="menu" class="veil" hidden>
    <div class="box">
      <h2 id="m-title">Menu</h2>
      <button type="button" id="m-snd" class="btn alt"></button>
      <button type="button" id="m-copy" class="btn alt">Copy code</button>
      <div class="row"><input id="m-code" type="text" placeholder="Paste a code" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="m-load" class="btn alt">Load code</button></div>
      <div id="test" hidden>
        <div class="row" id="t-speed"><button type="button" data-s="1" class="btn alt">x1</button><button type="button" data-s="10" class="btn alt">x10</button><button type="button" data-s="100" class="btn alt">x100</button></div>
        <div class="row"><button type="button" id="t-hour" class="btn alt">+1 h income</button><button type="button" id="t-gems" class="btn alt">+100 gems</button></div>
        <button type="button" id="t-free" class="btn alt">Unlimited money: on</button>
        <button type="button" id="t-goals" class="btn alt">Finish goals</button>
      </div>
      <button type="button" id="m-reset" class="btn alt">Reset store</button>
      <p class="credit">Models: Kenney (www.kenney.nl)<br>Icons: LimeZu (https://limezu.itch.io/)</p>
      <button type="button" id="m-ok" class="btn">Close</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="sim.js"></script>
<script type="module" src="store.js"></script>
<script src="ui.js" defer></script>
</body>
</html>
