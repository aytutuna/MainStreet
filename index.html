<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3a3a50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Main Street</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="top">
      <div id="hud" class="card">
        <button type="button" id="stats">
          <span class="stat" id="st-cash"><img class="ico" src="assets/ico_coin.png" alt=""><b></b></span>
          <span class="stat" id="st-pop"><img class="ico" src="assets/ico_resident.png" alt=""><b></b></span>
          <span class="stat" id="st-work"><img class="ico" src="assets/ico_worker.png" alt=""><b></b></span>
          <span class="stat" id="st-happy"><img class="ico big" src="assets/ico_face_ok.png" alt=""><b></b></span>
        </button>
        <button type="button" id="goodsbtn" aria-label="Goods"><img class="ico big" src="assets/ico_goods.png" alt=""></button>
      </div>
      <div id="ask" class="card" hidden>
        <p></p>
        <button type="button" class="more" hidden></button>
        <button type="button" class="btn go">Show me</button>
        <span class="waits" hidden>Under way</span>
      </div>
    </div>
  </main>
  <aside id="panel">
    <div id="sheet" class="idle"></div>
    <nav id="tabs">
      <button type="button" data-tab="map" class="on">Map</button>
      <button type="button" data-tab="req">Requests<i hidden></i></button>
      <button type="button" data-tab="goods">Goods</button>
      <button type="button" data-tab="town">Town</button>
    </nav>
  </aside>
  <div id="away" hidden>
    <div class="card">
      <h2>While you were away</h2>
      <p id="awaytime"></p>
      <ul id="awaylist"></ul>
      <button type="button" id="awayok" class="btn go">OK</button>
    </div>
  </div>
  <div id="won" hidden>
    <div class="card">
      <h2>Main Street is thriving</h2>
      <ul id="wonlist"></ul>
      <button type="button" id="wonok" class="btn go">Keep playing</button>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
</body>
</html>
