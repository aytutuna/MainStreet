name: TestFlight

# Builds the iPhone app for the App Store and uploads it to TestFlight. Run it by hand from the
# Actions tab. Signing is cloud-managed through the App Store Connect API key in the repository
# secrets, so no certificate or profile is kept here.
on:
  workflow_dispatch:
    inputs:
      tester:
        description: Tester build (test menu and test ads)
        type: boolean
        default: false
      upload:
        description: Upload to TestFlight (off archives and exports only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  upload:
    needs: check
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TESTER_CONDITIONS: ${{ inputs.tester && '$(inherited) TESTER' || '$(inherited)' }}
      MS_TESTER: ${{ inputs.tester && '1' || '' }}
      EXPORT_DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      # Pinned release, checked against its SHA-256.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: xcodegen generate --spec ios/project.yml
      - name: Write the API key
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"
      # The archive is left unsigned and signed on export instead: an automatically signed archive
      # wants a development profile, which needs a registered device, and CI has none. The run
      # number is the build number, times ten plus the attempt, so every upload and every re-run gets a new one.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/MainStreet.xcodeproj \
            -scheme MainStreet \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/MainStreet.xcarchive" \
            CURRENT_PROJECT_VERSION=$((${{ github.run_number }} * 10 + ${{ github.run_attempt }})) \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$TESTER_CONDITIONS" \
            MS_TESTER="$MS_TESTER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Check the tester switch
        run: |
          app="$RUNNER_TEMP/MainStreet.xcarchive/Products/Applications/MainStreet.app"
          stamp=$(plutil -extract MSTester raw "$app/Info.plist")
          if [ "${{ inputs.tester }}" = "true" ]; then [ "$stamp" = "1" ]; else [ -z "$stamp" ]; fi
      # An unsigned archive leaves the ads frameworks it embeds without a valid signature, and the export only
      # re-signs code that is signed already, so they get an ad hoc signature first and the export signs them for real.
      - name: Sign the embedded frameworks ad hoc
        run: |
          app="$RUNNER_TEMP/MainStreet.xcarchive/Products/Applications/MainStreet.app"
          for f in "$app"/Frameworks/*.framework; do
            [ -e "$f" ] && codesign --force --sign - "$f"
          done
          codesign --force --sign - "$app"
      - name: Sign and export
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>$EXPORT_DESTINATION</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MainStreet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
