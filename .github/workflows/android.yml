name: Android

# Lint and a debug build. Unsigned, no secrets, and the APK is not kept: run artifacts of a public repo can be downloaded by anyone.
on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"
      - name: Lint and debug build
        working-directory: android
        run: ./gradlew lint assembleDebug
